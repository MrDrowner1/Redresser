[General]
; Verbose messages in the console about what this mod does.
Debug = false

; Gives NPCs default clothes if they don't have anything to cover themselves with.
GiveDefaultItems = true

; Who will be selected for redressing:
; 0 = Everyone
; 1 = Only fully naked NPSs (must have all 4 slots empty: Body, Hands, Feet, Head)
; 2 = Only NPCs with no main armor equipped (at least the Body slot is empty)
SelectedActors = 2

; Restricts the mod to equipping only Body, Hands, Feet or Head items.
; This prevents NPCs from equipping jewelry and other misc items that were previously stashed in their pockets.
EquipMainSlotsOnly = false

; Enables dressing up dead NPCs.
DressDeadActors = true

; Enables dressing up alive NPCs.
DressAliveActors = true

; Nudity is allowed in player homes.
SkipPlayerHome = true

; Active followers won't be dressed.
SkipActiveFollowers = true

; Sleeping NPCs won't be dressed.
SkipSleepingActors = true

; Comma separated EditorIDs of the factions you want to exclude. Whitespaces are ignored.
ExcludedFactions = 

; Comma separated EditorIDs of the keywords you want to exclude. Whitespaces are ignored.
ExcludedKeywords = 

; Ignore specific slots per faction (one per line).
; Example:
; FactionSlotsIgnore = ExampleFaction1|33,32,37
; FactionSlotsIgnore = ExampleFaction2|38,39,60
FactionSlotsIgnore = 
